<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ashes &amp; Crowns</title>
<style>
:root{
  --stone:#1a1714;
  --stone2:#232019;
  --parch:#cdbf9a;
  --parch2:#a89875;
  --ink:#0d0b09;
  --blood:#7a1a14;
  --blood2:#b8281c;
  --rust:#8a5a2b;
  --gold:#c9a24a;
  --green:#5a7a3a;
  --steel:#6b7680;
  --shadow:#000;
  --panel:#1e1b16;
  --border:#3a3228;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{
  background:var(--stone);
  color:var(--parch);
  font-family:"Georgia","Times New Roman",serif;
  font-size:15px;
  line-height:1.45;
  background-image:radial-gradient(circle at 50% 0%, #2a251d 0%, var(--stone) 70%);
}
#app{max-width:920px;margin:0 auto;padding:14px;min-height:100%}
h1,h2,h3{font-family:"Georgia",serif;color:var(--gold);letter-spacing:1px}
h1{font-size:30px;text-align:center;text-shadow:0 2px 6px #000;margin-bottom:4px}
.subtitle{text-align:center;color:var(--parch2);font-style:italic;margin-bottom:18px;font-size:14px}
.panel{
  background:var(--panel);
  border:1px solid var(--border);
  border-radius:4px;
  padding:14px;
  margin-bottom:12px;
  box-shadow:inset 0 0 30px rgba(0,0,0,.4);
}
.panel h2{font-size:18px;margin-bottom:8px;border-bottom:1px solid var(--border);padding-bottom:6px}
.panel h3{font-size:15px;margin:8px 0 4px}
.panel h4{font-size:13px;margin:8px 0 2px;font-family:Georgia,serif}
button{
  font-family:inherit;
  font-size:14px;
  background:linear-gradient(#332b20,#241e16);
  color:var(--parch);
  border:1px solid var(--border);
  border-radius:3px;
  padding:8px 12px;
  cursor:pointer;
  margin:3px;
  position:relative;
  overflow:hidden;
  text-align:left;
  transition:border-color .1s, background .1s;
}
button:hover:not(:disabled){border-color:var(--gold);background:linear-gradient(#3d3327,#2a231a)}
button:disabled{opacity:.45;cursor:not-allowed}
button.danger{border-color:var(--blood)}
button.danger:hover:not(:disabled){border-color:var(--blood2)}
button.gold{border-color:var(--rust)}
.btnrow{display:flex;flex-wrap:wrap;gap:2px}
.cd-overlay{position:absolute;left:0;top:0;bottom:0;background:rgba(0,0,0,.55);pointer-events:none;width:0%}
.stat-line{display:flex;justify-content:space-between;padding:2px 0;border-bottom:1px dotted #2a251d}
.stat-line span:last-child{color:#e6d8b0;font-weight:bold}
.bar{height:14px;background:#0d0b09;border:1px solid var(--border);border-radius:2px;overflow:hidden;position:relative;margin:3px 0}
.bar > div{height:100%;transition:width .12s linear}
.bar-label{position:absolute;left:6px;top:0;font-size:11px;line-height:14px;color:#ddd;text-shadow:0 0 2px #000;z-index:2}
.hp-fill{background:linear-gradient(var(--blood2),var(--blood))}
.stam-fill{background:linear-gradient(#c9a24a,#8a6a1a)}
.foe-hp-fill{background:linear-gradient(#9a3a2a,#5a1810)}
#log{
  height:200px;overflow-y:auto;background:#100e0b;border:1px solid var(--border);
  padding:8px;font-size:13.5px;border-radius:3px;
}
#log p{margin-bottom:4px;padding-bottom:4px;border-bottom:1px solid #1a1714}
.l-hit{color:#e07a5a}
.l-good{color:#9ac070}
.l-bad{color:#d84a3a;font-weight:bold}
.l-info{color:var(--parch2)}
.l-gold{color:var(--gold)}
.l-wound{color:#ff6a3a;font-weight:bold;text-transform:uppercase;letter-spacing:.5px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
@media(max-width:680px){.grid2,.grid3{grid-template-columns:1fr}}
.tag{display:inline-block;font-size:11px;padding:1px 6px;border-radius:8px;border:1px solid var(--border);margin-left:6px}
.tag-bleed{color:#ff6a3a;border-color:#7a1a14}
.tag-infect{color:#9a6acc;border-color:#5a3a8a}
.tag-perm{color:#ff4a3a;border-color:var(--blood);font-weight:bold}
.tag-heal{color:#9ac070;border-color:var(--green)}
.wound-item{padding:6px;border-left:3px solid var(--blood);background:#170d0b;margin-bottom:5px;border-radius:2px}
.wound-item.perm{border-left-color:#ff3a2a;background:#1a0a08}
.telegraph{height:26px;background:#0d0b09;border:2px solid #3a1a14;border-radius:3px;overflow:hidden;position:relative;margin:6px 0}
.telegraph > div{height:100%;width:0%;transition:width .05s linear}
.foe-state{text-align:center;font-weight:bold;font-size:17px;letter-spacing:2px;padding:4px;text-transform:uppercase}
.fs-idle{color:var(--parch2)}
.fs-wind{color:#ff8a3a;animation:pulse .6s infinite}
.fs-strike{color:#ff2a1a}
.fs-recover{color:#9ac070}
.fs-stagger{color:#6aa0cc}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}
.class-card{cursor:pointer;border:1px solid var(--border);padding:12px;border-radius:4px;background:#1e1b16;transition:all .12s}
.class-card:hover{border-color:var(--gold);background:#28231a;transform:translateY(-2px)}
.class-card h3{color:var(--gold)}
.diff{font-size:12px;font-style:italic}
.diff-easy{color:#9ac070}.diff-mid{color:var(--gold)}.diff-hard{color:#d84a3a}
.notif{position:fixed;top:0;left:0;right:0;text-align:center;padding:14px;font-size:18px;font-weight:bold;z-index:100;color:#fff;text-shadow:0 0 8px #000;animation:slidein .3s}
.notif.wound{background:rgba(122,26,20,.95);border-bottom:2px solid #ff4a3a}
.notif.death{background:rgba(0,0,0,.97);color:#b8281c;font-size:26px}
.notif.info{background:rgba(40,35,26,.95);border-bottom:2px solid var(--gold)}
@keyframes slidein{from{transform:translateY(-100%)}to{transform:translateY(0)}}
.event-box{border:1px solid var(--rust);background:#1a160f;padding:14px;border-radius:4px;margin-bottom:12px}
.event-box p.scene{font-style:italic;color:#d8c89a;margin-bottom:10px;font-size:15px}
.muted{color:var(--parch2);font-size:13px}
.shop-item{display:flex;justify-content:space-between;align-items:center;padding:6px;border-bottom:1px solid #2a251d}
.foe-row{display:flex;gap:14px;align-items:flex-start}
.foe-col{flex:1}
hr{border:none;border-top:1px solid var(--border);margin:8px 0}
.center{text-align:center}
.big-btn{font-size:16px;padding:12px 20px;text-align:center}
.equip-slot{font-size:13px;color:var(--parch2)}
.equip-slot b{color:#e6d8b0}
.foe-portrait{font-size:40px;text-align:center}
.followers-list .f-item{padding:5px;border-bottom:1px solid #2a251d;font-size:13px}
</style>
</head>
<body>
<div id="app"></div>

/* ============================================================ UTILITY ============================================================ */
function rand(a,b){return Math.floor(Math.random()*(b-a+1))+a;}
function pick(arr){return arr[Math.floor(Math.random()*arr.length)];}
function clamp(v,a,b){return Math.max(a,Math.min(b,v));}
function statName(k){return {str:"Strength",agi:"Agility",wit:"Wits",end:"Endurance"}[k];}

function notify(text,cls){
  const n=document.createElement("div");
  n.className="notif "+(cls||"info");
  n.textContent=text;
  document.body.appendChild(n);
  setTimeout(()=>{ n.style.transition="opacity .5s"; n.style.opacity="0"; setTimeout(()=>n.remove(),500); }, cls==="death"?4000:2200);
}

function log(text,cls){
  if(!G) return;
  G.log.unshift({text,cls:cls||"l-info"});
  if(G.log.length>60) G.log.pop();
  const el=document.getElementById("log");
  if(el){
    const p=document.createElement("p");
    p.className=cls||"l-info";
    p.textContent=text;
    el.insertBefore(p, el.firstChild);
    while(el.children.length>60) el.removeChild(el.lastChild);
  }
}

/* ============================================================ DERIVED STATS ============================================================ */
function calcDerived(){
  const base={...G.baseStats};
  let hpPenalty=0;
  G.permanentInjuries.forEach(inj=>{ for(const k in inj.statPenalty) base[k]=(base[k]||0)+inj.statPenalty[k]; });
  G.wounds.forEach(w=>{
    if(w.statPenalty) for(const k in w.statPenalty) base[k]=(base[k]||0)+w.statPenalty[k];
    if(w.hpPenalty) hpPenalty+=w.hpPenalty;
  });
  for(const k in base) base[k]=Math.max(0,base[k]);
  const wpn=WEAPONS[G.gear.weapon]||WEAPONS.fists;
  const arm=ARMORS[G.gear.armor]||ARMORS.rags;
  const shd=SHIELDS[G.gear.shield]||SHIELDS.none;
  G.str=base.str; G.agi=Math.max(1,base.agi+arm.agi); G.wit=base.wit; G.end=base.end;
  G.maxHp=Math.max(10, 40 + base.end*7 + base.str - hpPenalty);
  G.maxStam=Math.max(20, 60 + base.end*6);
  G.soak=arm.soak + Math.floor(base.end/4);
  G.block=shd.block;
  G.dmgMin=wpn.dmg[0]+Math.floor(base.str/2)+wpn.str;
  G.dmgMax=wpn.dmg[1]+Math.floor(base.str/2)+wpn.str;
  G.atkSpeed=wpn.speed;
  if(G.hp>G.maxHp) G.hp=G.maxHp;
}

/* ============================================================ GAME INIT ============================================================ */
function newGame(classKey){
  const c=CLASSES[classKey];
  G={
    classKey, className:c.name, icon:c.icon,
    baseStats:{...c.stats},
    str:0,agi:0,wit:0,end:0,
    hp:c.hp, maxHp:c.hp, stam:0, maxStam:0,
    soak:0,block:0,dmgMin:0,dmgMax:0,atkSpeed:1,
    gold:c.gold, rep:c.rep, day:1, loc:c.loc,
    gear:{...c.gear}, inv:[...c.inv],
    wounds:[], permanentInjuries:[], followers:[],
    jobXp:{}, log:[], dead:false,
    lastInfectTick:Date.now(), kills:0, fightsWon:0,
  };
  calcDerived(); G.hp=G.maxHp; G.stam=G.maxStam;
  log("Your tale begins as a "+c.name+". "+c.desc,"l-info");
  render();
}

function repTier(){ const r=G.rep; if(r>=80)return"Renowned"; if(r>=60)return"Honoured"; if(r>=40)return"Respected"; if(r>=20)return"Known"; return"Unknown"; }
function gainGold(n){ if(n===0)return; G.gold=Math.max(0,G.gold+n); if(n>0) log("You gain "+n+" silver.","l-gold"); render(); }
function gainRep(n){ if(n===0)return; G.rep=clamp(G.rep+n,0,100); log((n>0?"Your reputation rises (+":"Your reputation falls (")+n+").", n>0?"l-good":"l-bad"); render(); }

function roll(stat,dc,onSuccess,onFail){
  const r=rand(1,12)+(G[stat]||0);
  if(r>=dc){ onSuccess&&onSuccess(); } else { onFail&&onFail(); }
  render();
}

/* ============================================================ WOUNDS ============================================================ */
function addWound(severity,bodyPart,desc){
  let w=null;
  if(severity==="minor"){
    w={name:"Minor Wound",bodyPart,severity,daysLeft:2,bleedRate:1,infected:false,permanent:false,statPenalty:{},dayInflicted:G.day};
  } else if(severity==="serious"){
    const pen={};
    if(bodyPart==="arm") pen.str=-1; else if(bodyPart==="leg") pen.agi=-1; else if(bodyPart==="head") pen.wit=-1;
    w={name:"Serious Wound",bodyPart,severity,daysLeft:5,bleedRate:2,infected:false,permanent:false,statPenalty:pen,deep:true,dayInflicted:G.day};
  } else if(severity==="grievous"){
    let tmpl;
    if(bodyPart==="arm") tmpl=GRIEVOUS.arm_slash;
    else if(bodyPart==="leg") tmpl=GRIEVOUS.leg_slash;
    else if(bodyPart==="head") tmpl=GRIEVOUS.head_blunt;
    else tmpl=GRIEVOUS.torso;
    w={name:tmpl.name,bodyPart,severity,daysLeft:tmpl.daysLeft,bleedRate:tmpl.bleedRate,infected:false,permanent:false,
       statPenalty:{...tmpl.statPenalty},hpPenalty:tmpl.hpPenalty||0,deep:true,blackout:tmpl.blackout||false,
       permThreatDay:tmpl.permThreatDay, dayInflicted:G.day};
    notify(tmpl.name.toUpperCase()+"!","wound");
    log(">>> GRIEVOUS WOUND: "+tmpl.name+" — "+tmpl.desc,"l-wound");
  }
  if(w){
    G.wounds.push(w);
    if(severity!=="grievous") log("You take a "+severity+" wound to the "+bodyPart+". "+(desc||""),"l-wound");
    calcDerived();
  }
}

function addPermanentInjury(key){
  const t=PERMANENT_INJ[key];
  G.permanentInjuries.push({name:t.name,bodyPart:t.bodyPart,statPenalty:{...t.statPenalty}});
  notify(t.name.toUpperCase()+" — FOREVER","wound");
  log(">>> PERMANENT INJURY: "+t.name+" — "+t.desc,"l-wound");
  calcDerived();
}

function takeRawDamage(amount,bodyPart,flavor){
  bodyPart=bodyPart||pick(["arm","leg","torso","head"]);
  if(flavor) log(flavor,"l-hit");
  G.hp-=amount;
  const frac=amount/G.maxHp;
  if(frac>0.40 && Math.random()<0.35){
    if(bodyPart==="arm") addPermanentInjury("lost_arm");
    else if(bodyPart==="head") addPermanentInjury("lost_eye");
    else addWound("grievous",bodyPart);
  } else if(frac>0.25){ addWound("grievous",bodyPart); }
  else if(frac>=0.15){ addWound("serious",bodyPart); }
  else if(frac>=0.08){ addWound("minor",bodyPart); }
  else { log("A superficial hurt — bruises and scrapes, nothing more.","l-info"); }
  if(G.hp<=0){ die(flavor||"Your wounds claim you."); return; }
  calcDerived(); render();
}

function infectionTick(){
  if(!G||G.dead) return;
  const now=Date.now();
  if(now-G.lastInfectTick >= 600000){
    G.lastInfectTick=now;
    let dmg=0;
    G.wounds.forEach(w=>{ if(w.infected) dmg+=3; });
    if(dmg>0){
      G.hp-=dmg;
      log("Infection burns in your wounds. (-"+dmg+" HP)","l-bad");
      if(G.hp<=0){ die("Fever and rot take you in the night."); return; }
      render();
    }
  }
}
setInterval(infectionTick, 30000);

/* ============================================================ REST / DAY / HEALING ============================================================ */
function rest(){
  if(G.dead) return;
  advanceDay(1, true);
  log("You rest. A day passes.","l-info");
  if(Math.random()<0.35){ triggerEvent(); } else render();
}

function advanceDay(n, healing){
  for(let d=0;d<n;d++){
    G.day++;
    let wages=0;
    G.followers.forEach(f=>wages+=FOLLOWER_TYPES[f.type].wage);
    if(wages>0){
      if(G.gold>=wages){ G.gold-=wages; }
      else { log("You cannot pay your followers' wages. They desert you.","l-bad"); G.followers=[]; }
    }
    if(G.classKey==="lord"||G.classKey==="king"){ G.gold+=rand(3,8); }
    if(healing){
      const stillActive=[];
      G.wounds.forEach(w=>{
        if(w.deep && !w.infected && (G.day-(w.dayInflicted||G.day))>=3 && Math.random()<0.5){ w.infected=true; log("A wound has festered and gone bad.","l-bad"); }
        if(w.permThreatDay && (G.day-(w.dayInflicted||G.day))>=w.permThreatDay && !w.treated){
          if(Math.random()<0.4) addPermanentInjury("lame_perm");
          w.permThreatDay=null;
        }
        w.daysLeft -= w.infected?0.5:1;
        if(w.daysLeft<=0 && !w.infected){ log("A wound to your "+w.bodyPart+" has healed.","l-good"); }
        else stillActive.push(w);
      });
      G.wounds=stillActive;
      const infected=G.wounds.some(w=>w.infected);
      if(!infected){ G.hp=Math.min(G.maxHp, G.hp+Math.floor(G.maxHp*0.25)); }
    }
    G.stam=G.maxStam;
  }
  calcDerived(); render();
}

/* ============================================================ PHYSICIAN ============================================================ */
function visitPhysician(action){
  if(action==="treat"){
    const cost=Math.max(8, G.wounds.length*6);
    if(G.gold<cost){ log("You haven't the "+cost+" silver the physician asks.","l-bad"); return; }
    G.gold-=cost;
    G.wounds.forEach(w=>{
      w.infected=false; w.treated=true;
      if(w.severity==="serious") w.daysLeft=Math.min(w.daysLeft,2);
      else w.daysLeft=Math.max(1,Math.floor(w.daysLeft/2));
    });
    log("The physician cleans, stitches and binds your wounds. The rot is drawn out. ("+cost+" silver)","l-good");
    notify("The physician treats your wounds.","info");
    render();
  } else if(action==="heal"){
    const cost=15;
    if(G.gold<cost){ log("You cannot afford the physician's draught.","l-bad"); return; }
    G.gold-=cost;
    G.hp=Math.min(G.maxHp, G.hp+Math.floor(G.maxHp*0.4));
    log("A bitter draught and a poultice restore some of your strength. ("+cost+" silver)","l-good");
    render();
  }
}

/* ============================================================ SHOP ============================================================ */
function buyWeapon(k){ const w=WEAPONS[k]; if(G.gold<w.price){log("Not enough silver.","l-bad");return;} G.gold-=w.price; G.gear.weapon=k; calcDerived(); log("You buy the "+w.name+".","l-gold"); render(); }
function buyArmor(k){ const a=ARMORS[k]; if(G.gold<a.price){log("Not enough silver.","l-bad");return;} G.gold-=a.price; G.gear.armor=k; calcDerived(); log("You don the "+a.name+".","l-gold"); render(); }
function buyShield(k){ const s=SHIELDS[k]; if(G.gold<s.price){log("Not enough silver.","l-bad");return;} G.gold-=s.price; G.gear.shield=k; calcDerived(); log("You take up the "+s.name+".","l-gold"); render(); }
function buyItem(item){ const prices={bandage:4,salve:9}; const p=prices[item]; if(G.gold<p){log("Not enough silver.","l-bad");return;} G.gold-=p; G.inv.push(item); log("You buy a "+item+".","l-gold"); render(); }

/* ============================================================ FOLLOWERS ============================================================ */
const NAMES=["Aldric","Cob","Wat","Hob","Tomas","Garr","Edwin","Roe","Bran","Osric","Halden","Dunn","Pell","Symon","Aelric","Corbin"];
function randomName(){return pick(NAMES);}
function hireFollower(type){
  const t=FOLLOWER_TYPES[type];
  if(G.rep<t.repReq){ log("Your reputation isn't high enough to attract a "+t.name+".","l-bad"); return; }
  if(G.gold<t.hire){ log("You cannot afford the "+t.hire+" silver to hire a "+t.name+".","l-bad"); return; }
  G.gold-=t.hire;
  const nm=randomName();
  G.followers.push({type, hp:t.hp, maxHp:t.hp, name:nm, wounded:false, alive:true});
  log("You hire a "+t.name+", "+nm+". He swears to follow your banner.","l-good");
  render();
}
function dismissFollower(i){
  log(G.followers[i].name+" the "+FOLLOWER_TYPES[G.followers[i].type].name+" is released from your service.","l-info");
  G.followers.splice(i,1); render();
}

/* ============================================================ JOBS ============================================================ */
function doJob(job){
  if(G.stam<job.stam){ log("You are too exhausted for that work. Rest first.","l-bad"); return; }
  G.stam-=job.stam;
  if(job.combat && Math.random()<job.combat){
    log("The work turns dangerous!","l-bad");
    startCombat(pick(["thug","brigand","bandit","deserter"]),{reason:"trouble during your work",reward:{gold:job.pay,rep:job.rep||0}});
    return;
  }
  let pay;
  if(job.wits){
    if(G.wit>=8 || Math.random()<0.5){ pay=job.pay[1]; log("Your sharp eye catches the steward's fraud — and reclaims the missing silver!","l-good"); }
    else { pay=0; log("The ledgers swim before your eyes; you find nothing amiss.","l-info"); }
  } else if(job.ruling){
    pay=rand(job.pay[0],job.pay[1]);
    if(Math.random()<0.5){ gainRep(2); log("Your rulings are deemed just.","l-good"); }
    else { gainRep(-2); log("Your judgments breed resentment among the petitioners.","l-bad"); }
  } else { pay=rand(job.pay[0],job.pay[1]); }
  if(pay>0) gainGold(pay);
  else if(pay<0){ G.gold=Math.max(0,G.gold+pay); log("The work costs you "+(-pay)+" silver.","l-info"); }
  if(job.rep) gainRep(job.rep);
  if(job.xp){
    for(const k in job.xp){
      G.jobXp[k]=(G.jobXp[k]||0)+job.xp[k];
      if(G.jobXp[k]>=4){ G.jobXp[k]=0; G.baseStats[k]++; calcDerived(); log("Through hard labour your "+statName(k)+" has grown!","l-good"); }
    }
  }
  log("You complete the work: "+job.name+".","l-info");
  render();
}

/* ============================================================ TRAVEL & EVENTS ============================================================ */
function travel(dest){
  if(G.dead) return;
  log("You set out for "+LOCATIONS[dest].name+".","l-info");
  G.loc=dest;
  const chance = dest==="road" ? 1.0 : 0.45;
  if(Math.random()<chance){ triggerEvent(); }
  else { log("You arrive without incident.","l-info"); render(); }
}
function triggerEvent(){ pendingEvent=pick(EVENTS); render(); }
function resolveEvent(which){
  const ev=pendingEvent; pendingEvent=null;
  if(which==="involve") ev.involve.run();
  else if(which==="involve2" && ev.involve2) ev.involve2.run();
  else ev.walk.run();
  if(!combat) render();
}

/* ============================================================ COMBAT — "Ugly Real Fighting" ============================================================ */
const DT=50;

function startCombat(enemyKey, opts){
  opts=opts||{};
  const e=ENEMIES[enemyKey];
  combat={
    foeKey:enemyKey, foe:{...e, hp:e.hp, maxHp:e.hp},
    reason:opts.reason||"a fight", reward:opts.reward||{gold:[0,0],rep:0},
    state:"idle", stateTimer:rand(400,900), windupDur:rand(e.windup[0],e.windup[1]), parried:false,
    clinch:false, clinchTimer:0, foeClinch:false, foeClinchAccum:0,
    cooldowns:{strike:0,heavy:0,parry:0,shove:0,clinch:0,salve:0}, heavyWindup:0,
    followerCd:{}, clinchCd:8000, bleedAccum:0,
  };
  G.followers.forEach((f,i)=>{ if(f.alive) combat.followerCd[i]=FOLLOWER_TYPES[f.type].speed; });
  clearCombatIntervals();
  combatIntervals.push(setInterval(combatTick, DT));
  log("⚔ A fight begins — "+combat.reason+": "+e.desc+".","l-bad");
  render();
}

function clearCombatIntervals(){ combatIntervals.forEach(i=>clearInterval(i)); combatIntervals=[]; }

function endCombat(victory){
  clearCombatIntervals();
  const c=combat; combat=null;
  if(victory){
    G.fightsWon++; G.kills++;
    const r=c.reward;
    const g=rand(r.gold[0],r.gold[1]) + rand(c.foe.gold[0],c.foe.gold[1]);
    if(g>0) gainGold(g);
    if(r.rep) gainRep(r.rep);
    log("✔ You stand victorious over "+c.foe.desc+".","l-good");
    notify("Victory.","info");
  }
  render();
}

function combatTick(){
  if(!combat||!G||G.dead) return;
  const c=combat, f=c.foe;

  for(const k in c.cooldowns){ if(c.cooldowns[k]>0) c.cooldowns[k]=Math.max(0,c.cooldowns[k]-DT); }
  if(c.heavyWindup>0){ c.heavyWindup-=DT; if(c.heavyWindup<=0) executeHeavy(); }
  G.stam=Math.min(G.maxStam, G.stam + 3*DT/1000);

  c.bleedAccum+=DT;
  if(c.bleedAccum>=10000){
    c.bleedAccum=0;
    let bleed=0; G.wounds.forEach(w=>bleed+=(w.bleedRate||0));
    if(bleed>0){ G.hp-=bleed; log("Your wounds bleed in the strain of battle. (-"+bleed+" HP)","l-bad"); if(G.hp<=0){ die("You bleed out mid-fight."); return; } }
  }

  if(!c.clinch && !c.foeClinch){
    c.stateTimer-=DT;
    if(c.state==="idle"){
      if(c.stateTimer<=0){ c.state="winding_up"; c.windupDur=rand(f.windup[0],f.windup[1]); c.stateTimer=c.windupDur; c.parried=false; }
    } else if(c.state==="winding_up"){
      if(c.stateTimer<=0){
        if(c.parried){ c.state="recovering"; c.stateTimer=900; }
        else { c.state="striking"; c.stateTimer=200; foeStrike(); }
      }
    } else if(c.state==="striking"){
      if(c.stateTimer<=0){ c.state="recovering"; c.stateTimer=rand(700,1100); }
    } else if(c.state==="recovering"){
      if(c.stateTimer<=0){ c.state="idle"; c.stateTimer=rand(400,900); }
    } else if(c.state==="staggered"){
      if(c.stateTimer<=0){ c.state="idle"; c.stateTimer=400; }
    }
    if(c.clinchCd>0) c.clinchCd-=DT;
    if(c.state==="idle" && c.clinchCd<=0 && Math.random()<0.0015 && f.agi>=6){
      c.foeClinch=true; c.clinchTimer=2500; c.clinchCd=10000;
      log(f.name+" lunges in and grabs you — you're in a clinch!","l-bad");
    }
  } else if(c.foeClinch){
    c.clinchTimer-=DT;
    c.foeClinchAccum+=DT;
    if(c.foeClinchAccum>=1200){
      c.foeClinchAccum=0;
      applyPlayerDamage(rand(2,5),"torso",f.name+" drives a knee into your gut.");
      if(G.dead||!combat) return;
    }
    if(c.clinchTimer<=0){ c.foeClinch=false; c.state="recovering"; c.stateTimer=600; log("You wrench free of the clinch.","l-info"); }
  }

  // followers
  G.followers.forEach((fl,i)=>{
    if(!fl.alive) return;
    const t=FOLLOWER_TYPES[fl.type];
    if(c.followerCd[i]===undefined) c.followerCd[i]=t.speed;
    c.followerCd[i]-=DT;
    if(c.followerCd[i]<=0){
      c.followerCd[i]=t.speed*(fl.wounded?1.5:1);
      let d=rand(t.dmg[0],t.dmg[1]);
      if(fl.wounded) d=Math.floor(d*0.6);
      d=Math.max(1,d-Math.floor(f.soak/2));
      f.hp-=d;
      if(Math.random()<0.4) log(fl.name+" lands a blow on "+f.name+". (-"+d+")","l-hit");
      if(f.hp<=0){ endCombat(true); return; }
      if(Math.random()<0.12){
        const fd=rand(f.dmg[0],f.dmg[1]);
        fl.hp-=fd;
        if(fl.hp<=0){ fl.alive=false; log("✖ "+fl.name+" the "+t.name+" is cut down and lies still. He is gone forever.","l-bad"); notify(fl.name+" has fallen.","wound"); }
        else if(fl.hp<fl.maxHp*0.4 && !fl.wounded){ fl.wounded=true; log(fl.name+" is wounded and falters.","l-bad"); }
      }
    }
  });

  if(f.hp<=0){ endCombat(true); return; }
  updateCombatUI();
}

function foeStrike(){
  const c=combat, f=c.foe;
  let dmg=rand(f.dmg[0],f.dmg[1]);
  const bodyPart=pick(["arm","leg","torso","head"]);
  if(c.heavyWindup>0){ dmg=Math.floor(dmg*1.4); log(f.name+" catches you mid-swing!","l-bad"); }
  applyPlayerDamage(dmg, bodyPart, foeHitFlavor(f,bodyPart));
}

function foeHitFlavor(f,part){
  const flavors={
    head:["His blow snaps your head back, blood in your eyes.","He cracks you across the skull.","A fist like a hammer finds your jaw."],
    arm:["His blade opens your arm to the bone.","He slashes across your forearm.","Steel bites deep into your shoulder."],
    leg:["He hacks at your thigh and you buckle.","A cut to the leg, hot and deep.","He kicks your knee sideways."],
    torso:["His blade opens your side.","He drives his weapon into your ribs.","Steel finds the gap and slips into your gut."],
  };
  return pick(flavors[part]||flavors.torso);
}

function applyPlayerDamage(rawDmg, bodyPart, flavor){
  let dmg=rawDmg;
  if(G.block>0 && Math.random()<0.3){ const before=dmg; dmg=Math.max(0,dmg-G.block); if(dmg<before) log("Your shield turns much of the blow.","l-info"); }
  dmg=Math.max(1, dmg - Math.floor(G.soak/2));
  if(flavor) log(flavor,"l-hit");
  G.hp-=dmg;
  log("You take "+dmg+" damage.","l-hit");
  const frac=dmg/G.maxHp;
  if(frac>0.40 && Math.random()<0.35){
    if(bodyPart==="arm") addPermanentInjury("lost_arm");
    else if(bodyPart==="head") addPermanentInjury("lost_eye");
    else addWound("grievous",bodyPart);
  } else if(frac>0.25){ addWound("grievous",bodyPart); }
  else if(frac>=0.15){ addWound("serious",bodyPart); }
  else if(frac>=0.08){ addWound("minor",bodyPart); }
  if(G.hp<=0){ die(flavor||"You fall, and do not rise."); return; }
  calcDerived(); updateCombatUI();
}

/* ---- PLAYER COMBAT ACTIONS ---- */
function stamMult(){ return G.stam < G.maxStam*0.30 ? 1.3 : 1; }
function lowStam(){ return G.stam < G.maxStam*0.15; }

function pStrike(){
  const c=combat; if(!c||c.cooldowns.strike>0||c.heavyWindup>0||c.clinch) return;
  if(c.foeClinch){ log("You can't strike cleanly — you're grappled!","l-bad"); return; }
  if(G.stam<8){ log("Too winded to strike.","l-bad"); return; }
  G.stam-=8; c.cooldowns.strike=800*stamMult();
  if(G.stam<G.maxStam*0.30 && Math.random()<0.20){ log("Your tired swing goes wide.","l-info"); updateCombatUI(); return; }
  let dmg=rand(G.dmgMin,G.dmgMax);
  if(c.state==="recovering"){ dmg=Math.floor(dmg*1.6); log("He's open! ","l-good"); }
  dealFoeDamage(dmg, pick(["You drive your fist into his jaw.","You cut him across the chest.","Your blade rakes his arm.","You crack him hard across the ribs."]));
}

function pHeavy(){
  const c=combat; if(!c||c.cooldowns.heavy>0||c.heavyWindup>0||c.clinch) return;
  if(c.foeClinch){ log("You can't wind up a heavy blow while grappled!","l-bad"); return; }
  if(G.stam<18){ log("Not enough strength left for a heavy blow.","l-bad"); return; }
  G.stam-=18;
  if(lowStam() && Math.random()<0.4){ log("You stumble as you wind up — fumble!","l-bad"); c.cooldowns.heavy=1600; updateCombatUI(); return; }
  c.heavyWindup=800; c.cooldowns.heavy=1600*stamMult();
  log("You wind up for a heavy blow — committing everything to it.","l-info");
  updateCombatUI();
}
function executeHeavy(){
  const c=combat; if(!c) return;
  let dmg=Math.floor(rand(G.dmgMin,G.dmgMax)*2.0);
  if(c.state==="recovering") dmg=Math.floor(dmg*1.4);
  dealFoeDamage(dmg, pick(["You wind up and crash your elbow into his temple.","Your heavy blow lands with a sickening crunch.","You commit your whole weight and shatter his guard."]));
}

function pParry(){
  const c=combat; if(!c||c.cooldowns.parry>0||c.clinch) return;
  if(G.stam<5){ log("Too winded to parry.","l-bad"); return; }
  G.stam-=5; c.cooldowns.parry=600;
  if(c.state==="winding_up"){
    const frac=(c.windupDur - c.stateTimer)/c.windupDur;
    if(lowStam() && Math.random()<0.4){ log("Your guard wavers — the parry fails!","l-bad"); updateCombatUI(); return; }
    if(frac<=0.70){
      c.parried=true;
      log("You catch his blade and turn it aside — perfect!","l-good");
      dealFoeDamage(Math.floor(rand(G.dmgMin,G.dmgMax)*0.8), "You riposte instantly, opening a gash.");
    } else {
      c.parried=true;
      log("Late parry — you blunt the blow but it still bites.","l-info");
      const f=c.foe;
      let dmg=Math.max(1, Math.floor(rand(f.dmg[0],f.dmg[1])*0.4)-Math.floor(G.soak/2));
      G.hp-=dmg; log("You take "+dmg+" damage through your guard.","l-hit");
      if(G.hp<=0){ die("A blow slips your failing guard."); return; }
    }
  } else { log("You parry empty air — wasted.","l-info"); }
  calcDerived(); updateCombatUI();
}

function pShove(){
  const c=combat; if(!c||c.cooldowns.shove>0||c.clinch) return;
  if(G.stam<12){ log("Too winded to shove.","l-bad"); return; }
  G.stam-=12; c.cooldowns.shove=1200*stamMult();
  if(c.foeClinch){ c.foeClinch=false; c.state="staggered"; c.stateTimer=1500; log("You shove him off and break the clinch!","l-good"); }
  else { c.state="staggered"; c.stateTimer=rand(1000,2000); log("You shove him back hard — he staggers, off balance.","l-good"); }
  updateCombatUI();
}

function pClinch(){
  const c=combat; if(!c||c.cooldowns.clinch>0||c.clinch||c.foeClinch) return;
  if(G.stam<10){ log("Too winded to grapple.","l-bad"); return; }
  G.stam-=10; c.cooldowns.clinch=2000;
  c.clinch=true; c.clinchTimer=4000;
  log("You grab him by the collar and drag him into a clinch.","l-good");
  document.getElementById("combat-actions").innerHTML=combatActions();
  updateCombatUI();
}
function clinchMove(move){
  const c=combat; if(!c||!c.clinch) return;
  if(G.stam<10){ log("Too winded.","l-bad"); return; }
  G.stam-=10;
  if(move==="headbutt"){ dealFoeDamage(rand(4,8),"You smash your forehead into his nose — he reels, stunned."); }
  else if(move==="knee"){ dealFoeDamage(rand(3,6),"You drive your knee up into him, hammering the breath from his lungs."); }
  else if(move==="throat"){ dealFoeDamage(rand(6,11),"You clamp a hand on his throat and squeeze — he chokes and thrashes."); }
  else if(move==="throw"){
    dealFoeDamage(rand(5,9),"You sweep his leg and slam him to the ground.");
    if(combat){ c.clinch=false; c.state="staggered"; c.stateTimer=1800; log("The clinch breaks — he's down and staggered.","l-good"); }
  }
  if(!combat) return;
  c.clinchTimer-=600;
  if(c.clinchTimer<=0 && c.clinch){ c.clinch=false; c.state="idle"; c.stateTimer=400; log("The clinch breaks apart.","l-info"); }
  if(!c.clinch) document.getElementById("combat-actions").innerHTML=combatActions();
  updateCombatUI();
}

function pSalve(){
  const c=combat; if(!c||c.cooldowns.salve>0) return;
  let idx=G.inv.indexOf("salve");
  if(idx<0) idx=G.inv.indexOf("bandage");
  if(idx<0){ log("You have no salve or bandage.","l-bad"); return; }
  const item=G.inv[idx]; G.inv.splice(idx,1); c.cooldowns.salve=3000;
  const bleeder=G.wounds.find(w=>w.bleedRate>0);
  if(bleeder){ bleeder.bleedRate=Math.max(0,bleeder.bleedRate-1); log("You press a "+item+" to your worst wound, stemming the bleed.","l-good"); }
  G.hp=Math.min(G.maxHp, G.hp + (item==="salve"?10:5));
  log("You patch yourself mid-fight.","l-good");
  calcDerived(); updateCombatUI();
}

function pFlee(){
  const c=combat; if(!c) return;
  let dc=11;
  if(G.stam < G.maxStam*0.20) dc=7;
  roll("agi", dc, ()=>{
    log("You break away and vanish into the streets. You live to fight another day.","l-info");
    clearCombatIntervals(); combat=null; render();
  }, ()=>{
    log("You turn to run — and he catches you a parting blow!","l-bad");
    const f=c.foe;
    applyPlayerDamage(rand(f.dmg[0],f.dmg[1]),"torso","He strikes you as you flee.");
  });
}

function dealFoeDamage(dmg, flavor){
  const c=combat; const f=c.foe;
  dmg=Math.max(1, dmg - f.soak);
  if(Math.random() < f.agi*0.018){ log(f.name+" twists away from your attack.","l-info"); updateCombatUI(); return; }
  f.hp-=dmg;
  if(flavor) log(flavor+" (-"+dmg+")","l-good");
  if(f.hp<=0){ endCombat(true); return; }
  updateCombatUI();
}

/* ============================================================ DEATH ============================================================ */
function die(cause){
  if(G.dead) return;
  G.dead=true;
  clearCombatIntervals(); combat=null; pendingEvent=null;
  log("☠ "+cause,"l-bad");
  log("☠ Your story ends here, on day "+G.day+". Death is permanent.","l-bad");
  notify("YOU HAVE DIED","death");
  render();
}

/* ============================================================ RENDERING ============================================================ */
function render(){
  const app=document.getElementById("app");
  if(!G){ app.innerHTML=titleScreen(); return; }
  if(G.dead){ app.innerHTML=deathScreen(); attachLog(); return; }
  if(combat){ app.innerHTML=combatScreen(); attachLog(); updateCombatUI(); return; }
  app.innerHTML=mainScreen(); attachLog();
}

function attachLog(){
  const el=document.getElementById("log");
  if(!el) return;
  el.innerHTML="";
  G.log.forEach(e=>{ const p=document.createElement("p"); p.className=e.cls; p.textContent=e.text; el.appendChild(p); });
}

function titleScreen(){
  let cards="";
  for(const k in CLASSES){
    const c=CLASSES[k];
    cards+=`<div class="class-card" onclick="newGame('${k}')">
      <h3>${c.icon} ${c.name} <span class="diff ${c.diffClass}">(${c.diff})</span></h3>
      <p class="muted">${c.desc}</p>
      <p class="muted">STR ${c.stats.str} · AGI ${c.stats.agi} · WIT ${c.stats.wit} · END ${c.stats.end} · HP ${c.hp} · ${c.gold}s · rep ${c.rep}</p>
    </div>`;
  }
  return `<h1>ASHES &amp; CROWNS</h1>
  <p class="subtitle">A medieval life. Every wound remembered. Death is forever.</p>
  <div class="panel">
    <h2>Choose Your Lot in Life</h2>
    <p class="muted" style="margin-bottom:12px">The lower-born you start, the harder the road. There is no respawn — when you die, your tale is over.</p>
    <div class="grid2">${cards}</div>
  </div>
  <p class="center muted">A single life. Fight ugly. Stay alive.</p>`;
}

function deathScreen(){
  return `<h1 style="color:#b8281c">☠ DEATH ☠</h1>
  <div class="panel center">
    <h2>The tale of a ${G.className} ends.</h2>
    <p class="muted" style="margin:12px 0">You survived ${G.day} days.</p>
    <p>Fights won: <b>${G.fightsWon}</b> · Final reputation: <b>${G.rep} (${repTier()})</b> · Silver: <b>${G.gold}</b></p>
    <p class="muted" style="margin:10px 0">${G.permanentInjuries.length} permanent injuries carried · ${G.wounds.length} open wounds at the end.</p>
    <div id="log" style="text-align:left;margin:14px 0"></div>
    <button class="big-btn gold" onclick="G=null;combat=null;pendingEvent=null;render()">Begin a New Life</button>
  </div>`;
}

function mainScreen(){
  if(pendingEvent) return eventScreen();
  return `<h1>ASHES &amp; CROWNS</h1>
  <div class="grid2">${characterPanel()}${woundsPanel()}</div>
  ${locationPanel()}
  <div class="panel"><h2>Chronicle</h2><div id="log"></div></div>`;
}

function characterPanel(){
  const hpPct=clamp(G.hp/G.maxHp*100,0,100);
  const stPct=clamp(G.stam/G.maxStam*100,0,100);
  return `<div class="panel">
    <h2>${G.icon} The ${G.className}</h2>
    <div class="bar"><div class="hp-fill" style="width:${hpPct}%"></div><span class="bar-label">HP ${Math.ceil(G.hp)}/${G.maxHp}</span></div>
    <div class="bar"><div class="stam-fill" style="width:${stPct}%"></div><span class="bar-label">Stamina ${Math.ceil(G.stam)}/${G.maxStam}</span></div>
    <div class="stat-line"><span>Strength</span><span>${G.str}</span></div>
    <div class="stat-line"><span>Agility</span><span>${G.agi}</span></div>
    <div class="stat-line"><span>Wits</span><span>${G.wit}</span></div>
    <div class="stat-line"><span>Endurance</span><span>${G.end}</span></div>
    <hr>
    <div class="stat-line"><span>Silver</span><span class="l-gold">${G.gold}</span></div>
    <div class="stat-line"><span>Reputation</span><span>${G.rep} · ${repTier()}</span></div>
    <div class="stat-line"><span>Day</span><span>${G.day}</span></div>
    <hr>
    <div class="equip-slot">Weapon: <b>${WEAPONS[G.gear.weapon].name}</b> (${G.dmgMin}-${G.dmgMax} dmg)</div>
    <div class="equip-slot">Armour: <b>${ARMORS[G.gear.armor].name}</b> (soak ${G.soak})</div>
    <div class="equip-slot">Shield: <b>${SHIELDS[G.gear.shield].name}</b> (block ${G.block})</div>
    <div class="equip-slot">Pack: ${G.inv.length?G.inv.join(", "):"empty"}</div>
    ${followersPanel()}
  </div>`;
}

function followersPanel(){
  if(!G.followers.length) return "";
  let s='<hr><h3>Retinue</h3><div class="followers-list">';
  G.followers.forEach((f,i)=>{
    const t=FOLLOWER_TYPES[f.type];
    s+=`<div class="f-item">${f.name}, ${t.name} ${f.wounded?'<span class="tag tag-bleed">wounded</span>':''} <button style="padding:2px 6px;font-size:11px" onclick="dismissFollower(${i})">dismiss</button></div>`;
  });
  return s+"</div>";
}

function woundsPanel(){
  let s=`<div class="panel"><h2>Wounds &amp; Injuries</h2>`;
  if(!G.wounds.length && !G.permanentInjuries.length) s+=`<p class="muted">You are whole and unmarked. For now.</p>`;
  G.permanentInjuries.forEach(inj=>{
    const pens=Object.entries(inj.statPenalty).map(([k,v])=>statName(k)+" "+v).join(", ");
    s+=`<div class="wound-item perm"><b>${inj.name}</b> <span class="tag tag-perm">PERMANENT</span><br><span class="muted">${inj.bodyPart} · ${pens}</span></div>`;
  });
  G.wounds.forEach(w=>{
    let pens=Object.entries(w.statPenalty||{}).map(([k,v])=>statName(k)+" "+v).join(", ");
    if(w.hpPenalty) pens+=(pens?", ":"")+"max HP -"+w.hpPenalty;
    let tags="";
    if(w.bleedRate>0) tags+=`<span class="tag tag-bleed">bleeding ${w.bleedRate}/10s</span>`;
    if(w.infected) tags+=`<span class="tag tag-infect">INFECTED</span>`; else tags+=`<span class="tag tag-heal">healing</span>`;
    s+=`<div class="wound-item"><b>${w.name}</b> ${tags}<br><span class="muted">${w.bodyPart} · ${Math.ceil(w.daysLeft)} day(s) to heal${pens?" · "+pens:""}</span></div>`;
  });
  return s+`</div>`;
}

function locationPanel(){
  const loc=LOCATIONS[G.loc];
  let s=`<div class="panel"><h2>${loc.name}</h2><p class="muted" style="margin-bottom:10px">${loc.desc}</p>`;
  s+=`<h3>Work</h3><div class="btnrow">`;
  JOBS[G.classKey].forEach((job,i)=>{
    const lab=job.name + (job.pay[1]>0?` (${job.pay[0]===job.pay[1]?job.pay[1]:job.pay[0]+"-"+job.pay[1]}s)`:job.pay[0]<0?` (cost ${-job.pay[0]}s)`:" (no pay)");
    s+=`<button onclick="doJob(JOBS['${G.classKey}'][${i}])" ${G.stam<job.stam?'disabled':''}>${lab}<br><span class="muted" style="font-size:11px">${job.stam} stam${job.combat?" · risk":""}</span></button>`;
  });
  s+=`</div>`;
  if(G.loc==="market"){
    s+=`<hr><h3>Physician</h3><div class="btnrow">
      <button onclick="visitPhysician('treat')">Treat wounds (~${Math.max(8,G.wounds.length*6)}s)</button>
      <button onclick="visitPhysician('heal')">Healing draught (15s)</button>
    </div>`;
    s+=shopPanel(); s+=followerHirePanel();
  }
  if(G.loc==="square") s+=followerHirePanel();
  if(G.loc==="barracks") s+=shopPanel();
  s+=`<hr><h3>Rest</h3><div class="btnrow"><button onclick="rest()">Rest (advance 1 day, heal)</button></div>`;
  s+=`<hr><h3>Travel</h3><div class="btnrow">`;
  TRAVEL[G.loc].forEach(dest=>{ s+=`<button onclick="travel('${dest}')">Go to ${LOCATIONS[dest].name}${dest==="road"?" ⚠":""}</button>`; });
  return s+`</div></div>`;
}

function shopPanel(){
  let s=`<hr><h3>Market Wares</h3><h4 class="muted">Weapons</h4>`;
  for(const k in WEAPONS){ const w=WEAPONS[k]; if(w.price<=0)continue;
    s+=`<div class="shop-item"><span>${w.name} <span class="muted">(${w.dmg[0]}-${w.dmg[1]} dmg) — ${w.desc}</span></span><button ${G.gold<w.price||G.gear.weapon===k?'disabled':''} onclick="buyWeapon('${k}')">${G.gear.weapon===k?'equipped':w.price+'s'}</button></div>`; }
  s+=`<h4 class="muted">Armour</h4>`;
  for(const k in ARMORS){ const a=ARMORS[k]; if(a.price<=0)continue;
    s+=`<div class="shop-item"><span>${a.name} <span class="muted">(soak ${a.soak}) — ${a.desc}</span></span><button ${G.gold<a.price||G.gear.armor===k?'disabled':''} onclick="buyArmor('${k}')">${G.gear.armor===k?'equipped':a.price+'s'}</button></div>`; }
  s+=`<h4 class="muted">Shields</h4>`;
  for(const k in SHIELDS){ const sh=SHIELDS[k]; if(sh.price<=0)continue;
    s+=`<div class="shop-item"><span>${sh.name} <span class="muted">(block ${sh.block}) — ${sh.desc}</span></span><button ${G.gold<sh.price||G.gear.shield===k?'disabled':''} onclick="buyShield('${k}')">${G.gear.shield===k?'equipped':sh.price+'s'}</button></div>`; }
  s+=`<h4 class="muted">Supplies</h4>`;
  s+=`<div class="shop-item"><span>Bandage <span class="muted">(stops bleed, +5 HP)</span></span><button ${G.gold<4?'disabled':''} onclick="buyItem('bandage')">4s</button></div>`;
  s+=`<div class="shop-item"><span>Salve <span class="muted">(stops bleed, +10 HP)</span></span><button ${G.gold<9?'disabled':''} onclick="buyItem('salve')">9s</button></div>`;
  return s;
}

function followerHirePanel(){
  let s=`<hr><h3>Hire Followers <span class="muted">(rep ${G.rep})</span></h3>`;
  for(const k in FOLLOWER_TYPES){
    const t=FOLLOWER_TYPES[k];
    const locked=G.rep<t.repReq;
    s+=`<div class="shop-item"><span>${t.name} <span class="muted">(${t.desc})${locked?` — needs rep ${t.repReq}`:""}</span></span>
      <button ${locked||G.gold<t.hire?'disabled':''} onclick="hireFollower('${k}')">${t.hire}s +${t.wage}/day</button></div>`;
  }
  return s;
}

function eventScreen(){
  const ev=pendingEvent;
  let btns=`<button class="big-btn danger" onclick="resolveEvent('involve')">${ev.involve.label}</button>`;
  if(ev.involve2) btns+=`<button class="big-btn danger" onclick="resolveEvent('involve2')">${ev.involve2.label}</button>`;
  btns+=`<button class="big-btn" onclick="resolveEvent('walk')">${ev.walk.label}</button>`;
  return `<h1>ASHES &amp; CROWNS</h1>
  <div class="event-box">
    <h2>A Moment's Choice</h2>
    <p class="scene">${ev.scene}</p>
    <div class="btnrow">${btns}</div>
    <p class="muted" style="margin-top:8px">Getting involved risks wounds — or worse. Walking past is safe, but not always without cost.</p>
  </div>
  <div class="panel"><h2>Chronicle</h2><div id="log"></div></div>`;
}

function combatScreen(){
  const c=combat, f=c.foe;
  return `<h1 style="font-size:22px">⚔ FIGHT</h1>
  <div id="combat-screen">
    <div class="panel">
      <div class="foe-row">
        <div class="foe-portrait">${f.icon}</div>
        <div class="foe-col">
          <h2 style="border:none;padding:0">${f.name}</h2>
          <p class="muted">${f.desc}</p>
          <div class="bar"><div class="foe-hp-fill" id="foe-hp" style="width:100%"></div><span class="bar-label" id="foe-hp-lbl">HP ${f.hp}/${f.maxHp}</span></div>
          <div class="foe-state" id="foe-state">—</div>
          <div class="telegraph"><div id="telegraph-bar"></div></div>
        </div>
      </div>
    </div>
    <div class="panel">
      <div class="bar"><div class="hp-fill" id="p-hp" style="width:100%"></div><span class="bar-label" id="p-hp-lbl">HP ${Math.ceil(G.hp)}/${G.maxHp}</span></div>
      <div class="bar"><div class="stam-fill" id="p-stam" style="width:100%"></div><span class="bar-label" id="p-stam-lbl">Stamina ${Math.ceil(G.stam)}/${G.maxStam}</span></div>
      <div id="combat-actions">${combatActions()}</div>
    </div>
    <div class="panel"><h2>Chronicle</h2><div id="log"></div></div>
  </div>`;
}

function combatActions(){
  const c=combat;
  if(c.clinch){
    return `<h3>CLINCH — you have him grappled</h3><div class="btnrow">
      <button onclick="clinchMove('headbutt')">Headbutt <span class="muted">(stun)</span></button>
      <button onclick="clinchMove('knee')">Knee <span class="muted">(stam drain)</span></button>
      <button onclick="clinchMove('throat')">Throat grab <span class="muted">(choke)</span></button>
      <button onclick="clinchMove('throw')">Throw <span class="muted">(break + stagger)</span></button>
    </div>`;
  }
  return `<div class="btnrow">
    <button id="b-strike" onclick="pStrike()"><div class="cd-overlay" id="cd-strike"></div>Strike <span class="muted">(fast, -8)</span></button>
    <button id="b-heavy" onclick="pHeavy()"><div class="cd-overlay" id="cd-heavy"></div>Heavy <span class="muted">(windup, -18)</span></button>
    <button id="b-parry" class="danger" onclick="pParry()"><div class="cd-overlay" id="cd-parry"></div>Parry <span class="muted">(time it, -5)</span></button>
    <button id="b-shove" onclick="pShove()"><div class="cd-overlay" id="cd-shove"></div>Shove <span class="muted">(stagger, -12)</span></button>
    <button id="b-clinch" onclick="pClinch()"><div class="cd-overlay" id="cd-clinch"></div>Clinch <span class="muted">(grab, -10)</span></button>
    <button id="b-salve" onclick="pSalve()"><div class="cd-overlay" id="cd-salve"></div>Use Salve <span class="muted">(-bleed)</span></button>
    <button class="danger" onclick="pFlee()">Break Away <span class="muted">(flee)</span></button>
  </div>`;
}

function updateCombatUI(){
  if(!combat) return;
  const c=combat, f=c.foe;
  const foeHp=document.getElementById("foe-hp");
  if(!foeHp){ render(); return; }
  foeHp.style.width=clamp(f.hp/f.maxHp*100,0,100)+"%";
  document.getElementById("foe-hp-lbl").textContent="HP "+Math.max(0,Math.ceil(f.hp))+"/"+f.maxHp;
  document.getElementById("p-hp").style.width=clamp(G.hp/G.maxHp*100,0,100)+"%";
  document.getElementById("p-hp-lbl").textContent="HP "+Math.ceil(G.hp)+"/"+G.maxHp;
  document.getElementById("p-stam").style.width=clamp(G.stam/G.maxStam*100,0,100)+"%";
  document.getElementById("p-stam-lbl").textContent="Stamina "+Math.ceil(G.stam)+"/"+G.maxStam;

  const stEl=document.getElementById("foe-state");
  const tg=document.getElementById("telegraph-bar");
  if(stEl&&tg){
    if(c.foeClinch){ stEl.textContent="GRAPPLING YOU!"; stEl.className="foe-state fs-strike"; tg.style.width="100%"; tg.style.background="linear-gradient(90deg,#b8281c,#ff5a3a)"; }
    else if(c.state==="winding_up"){
      stEl.textContent="WINDING UP..."; stEl.className="foe-state fs-wind";
      const frac=1-(c.stateTimer/c.windupDur);
      tg.style.width=clamp(frac*100,0,100)+"%";
      tg.style.background = frac<=0.70 ? "linear-gradient(90deg,#3a8a3a,#6aff6a)" : "linear-gradient(90deg,#b8281c,#ff5a3a)";
    } else if(c.state==="striking"){ stEl.textContent="STRIKING!"; stEl.className="foe-state fs-strike"; tg.style.width="100%"; tg.style.background="linear-gradient(90deg,#b8281c,#ff5a3a)"; }
    else if(c.state==="recovering"){ stEl.textContent="RECOVERING — OPEN!"; stEl.className="foe-state fs-recover"; tg.style.width="0%"; }
    else if(c.state==="staggered"){ stEl.textContent="STAGGERED"; stEl.className="foe-state fs-stagger"; tg.style.width="0%"; }
    else { stEl.textContent="ready"; stEl.className="foe-state fs-idle"; tg.style.width="0%"; }
  }

  const cds={strike:800,heavy:1600,parry:600,shove:1200,clinch:2000,salve:3000};
  for(const k in cds){
    const ov=document.getElementById("cd-"+k);
    if(ov) ov.style.width = clamp(c.cooldowns[k]/cds[k]*100,0,100)+"%";
  }

  const hasClinchUI = !!document.querySelector('#combat-actions h3');
  if(c.clinch !== hasClinchUI){
    const ca=document.getElementById("combat-actions");
    if(ca) ca.innerHTML=combatActions();
  }
}

/* ============================================================ BOOT ============================================================ */
render();
</script>
</body>
</html>
